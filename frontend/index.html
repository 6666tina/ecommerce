<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>基础电商系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航 -->
<header>
    <h1>基础电商系统</h1>
    <nav>
        <a href="#">首页</a>
        <a href="#">商品</a>
        <a href="#">订单</a>
        <a href="#">个人中心</a>
    </nav>
</header>

<!-- 主体内容 -->
<main>

    <!-- 项目介绍 -->
    <section class="intro">
        <h2>项目介绍</h2>
        <p>
            本系统是一个基础电商平台示例，实现用户浏览商品、下单和订单管理等核心功能，
            用于教学与课程实践。
        </p>
    </section>

    <!-- 商品列表 -->
    <section class="products">
        <h2>商品列表</h2>
        <div class="product-list" id="product-list">
            <!-- JS 动态渲染 -->
        </div>
    </section>

    <!-- 订单信息 -->
    <section class="orders">
        <h2>我的订单</h2>
        <ul id="order-list">
            <li>订单号：10001 | 状态：已完成</li>
            <li>订单号：10002 | 状态：待发货</li>
        </ul>
    </section>

</main>

<footer>
    <p>© 2025 基础电商系统 | 课程实践项目</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
