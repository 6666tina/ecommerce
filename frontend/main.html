<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>系统主页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">电商管理系统</div>
        <div class="user-info">
            <span id="username">欢迎，用户</span>
            <button onclick="logout()">退出登录</button>
        </div>
    </header>

    <!-- 主体 -->
    <div class="container">
        <!-- 左侧菜单 -->
        <aside class="sidebar">
            <ul>
                <li class="active" onclick="loadPage('home')">首页</li>
                <li onclick="loadPage('orders')">订单管理</li>
                <li onclick="loadPage('products')">商品管理</li>
                <li onclick="loadPage('users')">用户管理</li>
            </ul>
        </aside>

        <!-- 内容区 -->
        <main class="content" id="content">
            <h2>欢迎进入系统</h2>
            <p>请选择左侧功能模块。</p>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
